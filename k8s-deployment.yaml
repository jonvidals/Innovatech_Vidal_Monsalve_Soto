 # ------------------ 1. BASE DE DATOS MYSQL ------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innovatech-db
  template:
    metadata:
      labels:
        app: innovatech-db
    spec:
      containers:
      - name: mysql
        image: 469897277417.dkr.ecr.us-east-1.amazonaws.com/db-repo:latest
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: admin123
        - name: MYSQL_DATABASE
          value: innovatech
---
apiVersion: v1
kind: Service
metadata:
  name: innovatech-db
spec:
  selector:
    app: innovatech-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP

---
# ------------------ 2. BACKEND VENTAS ------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-ventas-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: innovatech-ventas
  template:
    metadata:
      labels:
        app: innovatech-ventas
    spec:
      containers:
      - name: back-ventas
        image: 469897277417.dkr.ecr.us-east-1.amazonaws.com/back-ventas-repo:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "innovatech-db"
        - name: DB_USER
          value: "root"
        - name: DB_PASS
          value: "admin123"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: innovatech-ventas-backend # Este nombre exacto mapea con nginx.conf del Front
spec:
  selector:
    app: innovatech-ventas
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# ------------------ 3. BACKEND DESPACHOS ------------------
