---
# ------------------ 4. FRONTEND ------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: innovatech-frontend
  template:
    metadata:
      labels:
        app: innovatech-frontend
    spec:
      containers:
      - name: frontend
        image: 469897277417.dkr.ecr.us-east-1.amazonaws.com/frontend-repo:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: innovatech-frontend-service
spec:
  selector:
    app: innovatech-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer # Crea el Classic Load Balancer público de AWS automáticamente