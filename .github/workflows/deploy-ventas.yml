name: Deploy Backend Ventas

on:
  push:
    branches:
      - deploy
    paths:
      - 'back-Ventas_SpringBoot/**'
  workflow_dispatch: 

jobs:
  deploy-ventas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build y Push Ventas
        run: |
          docker build --no-cache -t ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas back-Ventas_SpringBoot
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas

      - name: Deploy Ventas en EC2 Privada
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker pull ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas",
              "docker rm -f backend-ventas || true",
              "docker run -d -p 8081:8080 --name backend-ventas ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas"
            ]' \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          
          # Esperar a que el comando se complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" || echo "Command execution completed or timed out"
          
          # Obtener el estado del comando
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --query 'Status' \
            --output text