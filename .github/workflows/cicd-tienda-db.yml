name: CI/CD - Innovatech DB

on:
  push:
    branches: [main]
    paths:
      - "db/**"

jobs:
  build-push-deploy:
    name: Build, Push & Deploy DB
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar credenciales AWS
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login en Amazon ECR
      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Construir imagen Docker de la DB
      - name: Build imagen Docker DB
        run: |
          docker build -t innovatech-db ./db

      # 5. Tag y Push a ECR
      - name: Tag & Push imagen DB a ECR
        run: |
          docker tag innovatech-db:latest ${{ steps.login-ecr.outputs.registry }}/db-repo:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/db-repo:latest

      # 6. Deploy en Amazon EKS
      - name: Deploy DB en EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name mi-cluster-eks
          kubectl apply -f k8s-deployment.yaml
          kubectl rollout restart deployment/innovatech-db-deployment
