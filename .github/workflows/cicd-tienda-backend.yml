name: CI/CD - Innovatech Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar credenciales AWS
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login en Amazon ECR
      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Construir imagen Docker back-ventas
      - name: Build imagen back-ventas
        run: |
          docker build -t innovatech-backend-ventas ./backend/back-ventas

      # 5. Construir imagen Docker back-despachos
      - name: Build imagen back-despachos
        run: |
          docker build -t innovatech-backend-despachos ./backend/back-despachos

      # 6. Tag & Push ambas imagenes a ECR
      - name: Tag & Push imagenes backend a ECR
        run: |
          docker tag innovatech-backend-ventas:latest ${{ steps.login-ecr.outputs.registry }}/back-ventas-repo:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/back-ventas-repo:latest

          docker tag innovatech-backend-despachos:latest ${{ steps.login-ecr.outputs.registry }}/back-despachos-repo:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/back-despachos-repo:latest

      # 7. Deploy en Amazon EKS
      - name: Deploy Backend en EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name innovatech-eks
          kubectl apply -f k8s-deployment.yaml
          kubectl rollout restart deployment/innovatech-ventas-deployment
          kubectl rollout restart deployment/innovatech-despachos-deployment
