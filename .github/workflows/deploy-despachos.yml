name: Deploy Backend Despachos

on:
  push:
    branches:
      - deploy # Cambio según rúbrica (Paso 3 y 4)
    paths:
      - 'back-Despachos_SpringBoot/**'
  workflow_dispatch: 

jobs:
  deploy-despachos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build y Push Despachos
        run: |
                  docker build --no-cache -t ${{ secrets.ECR_REPO_URL_BACKEND }}:despachos back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
                  docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:despachos

      - name: Deploy Despachos en EC2 Privada
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker pull ${{ secrets.ECR_REPO_URL_BACKEND }}:despachos",
              "docker rm -f backend-despachos || true",
              "docker run -d -p 8080:8080 --name backend-despachos -e SPRING_DATASOURCE_URL=jdbc:mysql://10.0.138.43:3306/db_innovatech ${{ secrets.ECR_REPO_URL_BACKEND }}:despachos"
            ]' \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          
          # Esperar a que el comando se complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" || echo "Command execution completed or timed out"
          
          # Obtener el estado del comando
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --query 'Status' \
            --output text